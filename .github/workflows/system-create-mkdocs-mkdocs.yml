name: Run Generate MkDocs Script Daily and on Push

permissions:
  contents: write
  actions: write

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  
  # Trigger the workflow on push events to the main branch
  push:
    branches:
      - main
    paths:
      - 'docs/**'  

jobs:
  generate-mkdocs:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    defaults:
      run:
        working-directory: ./scripts/generate-mkdocs  # Set default working directory

    steps:
      - name: Checkout Repository  # Pull the latest version of the repository
        uses: actions/checkout@v3

      - name: Set up Python  # Install the specified version of Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies  # Ensure required Python packages are installed
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run JSON to YAML Generation  # Execute the Python script that converts JSON to YAML
        run: python ./generate-mkdocs.py  # The path to working-directory

      - name: Copy mkdocs.yml to Root  # Copy the generated mkdocs.yml to the root directory
        run: cp ./mkdocs.yml ../../mkdocs.yml

      - name: Commit Updated mkdocs.yml in Root  # Commit and push the updated mkdocs.yml in the root directory
        run: |
          git config --global user.email "altoumibrahim11@gmail.com"
          git config --global user.name "SamirMohamed24"
          git add ../../mkdocs.yml  # Only add the root mkdocs.yml
          git commit -m "Updated mkdocs.yml [Automated Run]" || echo "No changes to commit"
          git push || echo "Nothing to push"


